<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mohammad Kamal Allaithi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0D12;
    --bg-card: #12161F;
    --bg-card-hover: #171C27;
    --text: #EDF2F7;
    --text-dim: #7E8AA0;
    --accent: #34D6BE;
    --accent-soft: rgba(52, 214, 190, 0.14);
    --border: rgba(237, 242, 247, 0.08);
    --border-hover: rgba(52, 214, 190, 0.45);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
  }

  *, *::before, *::after { box-sizing: inherit; }

  html {
    margin: 0;
    background: var(--bg);
  }

  body {
    font-family: 'IBM Plex Sans', -apple-system, sans-serif;
    color: var(--text);
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: 40px 20px;
    position: relative;
    overflow-x: hidden;
    background: var(--bg);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.001ms !important;
      transition-duration: 0.001ms !important;
    }
  }

  /* subtle hexagon field backdrop, tying to the "badge" motif */
  .field {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    opacity: 0.5;
    background-image:
      linear-gradient(30deg, rgba(52,214,190,0.05) 12%, transparent 12.5%, transparent 87%, rgba(52,214,190,0.05) 87.5%, rgba(52,214,190,0.05)),
      linear-gradient(150deg, rgba(52,214,190,0.05) 12%, transparent 12.5%, transparent 87%, rgba(52,214,190,0.05) 87.5%, rgba(52,214,190,0.05)),
      linear-gradient(30deg, rgba(52,214,190,0.05) 12%, transparent 12.5%, transparent 87%, rgba(52,214,190,0.05) 87.5%, rgba(52,214,190,0.05)),
      linear-gradient(150deg, rgba(52,214,190,0.05) 12%, transparent 12.5%, transparent 87%, rgba(52,214,190,0.05) 87.5%, rgba(52,214,190,0.05));
    background-size: 64px 112px;
    background-position: 0 0, 0 0, 32px 56px, 32px 56px;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 20%, black 0%, transparent 75%);
    mask-image: radial-gradient(ellipse 70% 60% at 50% 20%, black 0%, transparent 75%);
  }

  .card {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* Hexagon avatar frame, echoing a credential badge */
  .badge {
    width: 104px;
    height: 104px;
    margin-bottom: 22px;
    position: relative;
    animation: badge-float 4.2s ease-in-out 1.5s infinite;
  }

  @keyframes badge-float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  .badge svg { display: block; width: 100%; height: 100%; }

  .badge-ring {
    fill: none;
    stroke: var(--accent);
    stroke-width: 2.5;
    stroke-linejoin: round;
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    animation:
      draw-ring 1.4s cubic-bezier(0.65, 0, 0.35, 1) 0.15s forwards,
      ring-glow 3.6s ease-in-out 1.6s infinite;
  }

  @keyframes draw-ring {
    to { stroke-dashoffset: 0; }
  }

  @keyframes ring-glow {
    0%, 100% { filter: drop-shadow(0 0 0px var(--accent)); }
    50% { filter: drop-shadow(0 0 7px var(--accent)); }
  }

  .badge-fill {
    fill: #161B26;
  }

  .badge-initials {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 34px;
    font-weight: 600;
    fill: var(--text);
    opacity: 0;
    animation: fade-in 0.5s ease-out 1s forwards;
  }

  @keyframes fade-in {
    to { opacity: 1; }
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: clamp(24px, 6vw, 29px);
    font-weight: 600;
    letter-spacing: -0.01em;
    margin: 0 0 8px;
    text-align: center;
    line-height: 1.25;
  }

  .tagline {
    font-size: 15px;
    color: var(--text-dim);
    margin: 0 0 34px;
    text-align: center;
    max-width: 30ch;
    line-height: 1.5;
  }

  .links {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 18px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    text-decoration: none;
    color: var(--text);
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
  }

  .link-card:hover,
  .link-card:focus-visible {
    background: var(--bg-card-hover);
    border-color: var(--border-hover);
    transform: translateY(-1px);
  }

  .link-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .link-card:active {
    transform: translateY(0);
  }

  .icon {
    flex: none;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: var(--accent-soft);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon svg {
    width: 19px;
    height: 19px;
    stroke: var(--accent);
    fill: none;
    stroke-width: 1.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }

  .link-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .link-title {
    font-weight: 600;
    font-size: 15.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .link-sub {
    font-size: 13px;
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  footer {
    margin-top: 40px;
    font-size: 12.5px;
    color: var(--text-dim);
    text-align: center;
    opacity: 0.7;
  }
</style>
</head>
